[package]
name = "ImmSim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["debug", "dynamic_linking"] }
bevy_rapier3d = { version = "0.35.0", features = ["debug-render-3d"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
